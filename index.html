<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiếu Đăng Ký Xét Tuyển - Viện Đào Tạo Sau Đại Học</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #2d3748; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    
    /* Header Trường & Viện */
    .brand-header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid #edf2f7; padding-bottom: 16px; }
    .university-name { font-size: 13px; font-weight: 700; color: #e53e3e; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
    .institute-name { font-size: 15px; font-weight: 800; color: #1a365d; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; color: #0f172a; }
    .subtitle { font-size: 13px; text-align: center; color: #64748b; margin-bottom: 24px; }
    
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 14px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; color: #0f172a; font-size: 14px; outline: none; transition: all 0.3s ease; }
    .form-control:focus { background-color: #ffffff; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    select.form-control { cursor: pointer; }
    
    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e40af, #2563eb); border: none; border-radius: 8px; color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); }
    .note { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 14px; }
    
    .alert { display: none; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 16px; }
    .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header Thông tin Đơn vị -->
    <div class="brand-header">
      <div class="university-name">TRƯỜNG ĐẠI HỌC GIA ĐỊNH</div>
      <div class="institute-name">VIỆN ĐÀO TẠO SAU ĐẠI HỌC</div>
    </div>

    <div class="title">Phiếu Đăng Ký Xét Tuyển</div>
    <div class="subtitle">Điền thông tin nhận thông báo & lộ trình xét tuyển Thạc sĩ</div>
    
    <div id="statusAlert" class="alert alert-success">Đăng ký thành công! Chúng tôi sẽ liên hệ sớm.</div>

    <form id="admissionForm">
      <div class="form-group">
        <label>1. Họ và tên *</label>
        <input type="text" class="form-control" name="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
      </div>

      <div class="form-group">
        <label>2. Số điện thoại *</label>
        <input type="tel" class="form-control" name="phone" placeholder="Ví dụ: 0912 345 678" pattern="[0-9]{9,11}" required>
      </div>

      <div class="form-group">
        <label>3. Ngành đăng ký dự tuyển *</label>
        <select class="form-control" name="major" required>
          <option value="" disabled selected>-- Chọn ngành đăng ký --</option>
          <option value="Luật">Luật</option>
          <option value="Quản trị kinh doanh">Quản trị kinh doanh</option>
        </select>
      </div>

      <div class="form-group">
        <label>4. Ngành tốt nghiệp bậc đại học *</label>
        <input type="text" class="form-control" name="degree" placeholder="Ví dụ: Ngôn ngữ Anh, Kế toán..." required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">NỘP HỒ SƠ XÉT TUYỂN NGAY 🚀</button>
      <div class="note">🔒 Bảo mật 100% thông tin cá nhân theo quy định.</div>
    </form>
  </div>

  <script>
    // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA HAI DẤU NGOẶC KÉP
    const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_CUA_BAN";

    const form = document.getElementById('admissionForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const alertBox = document.getElementById('statusAlert');

    form.addEventListener('submit', e => {
      e.preventDefault();
      btnSubmit.innerText = "Đang gửi dữ liệu...";
      btnSubmit.disabled = true;

      fetch(SCRIPT_URL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          alertBox.style.display = 'block';
          form.reset();
          btnSubmit.innerText = "NỘP HỒ SƠ XÉT TUYỂN NGAY 🚀";
          btnSubmit.disabled = false;
          setTimeout(() => alertBox.style.display = 'none', 5000);
        })
        .catch(error => {
          alert("Lỗi khi gửi dữ liệu, vui lòng thử lại!");
          btnSubmit.innerText = "NỘP HỒ SƠ XÉT TUYỂN NGAY 🚀";
          btnSubmit.disabled = false;
        });
    });
  </script>
</body>
</html>
